name: Verify demo

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
        env:
          PLAYWRIGHT_PRODUCTION: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
            playwright.config.cjs


  live-deployment-rehearsal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - typecheck-and-build
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for deployed site
        run: |
          for attempt in {1..24}; do
            if curl -fsS --max-time 15 https://manufacturer-five.vercel.app/ >/dev/null; then
              echo "Live site is reachable."
              sleep 30
              exit 0
            fi
            echo "Waiting for live deployment... attempt $attempt"
            sleep 10
          done
          echo "Live site did not become reachable in time."
          exit 1
      - name: Rehearse deployed demo on desktop and mobile
        run: npx playwright test tests/help-reset.spec.cjs tests/part10-full-workflow.spec.cjs --config=playwright.live.config.cjs
        env:
          LIVE_BASE_URL: https://manufacturer-five.vercel.app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-failure-evidence
          path: |
            test-results/
            playwright-live-report/
            playwright.live.config.cjs
